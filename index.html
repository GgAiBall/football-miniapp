<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>足球记录分析 · 小艺</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#0b5d3b; --green2:#128a4f; --gold:#f5b301; --bg:#f4f6f4;
  --card:#fff; --txt:#222; --sub:#7a7f7a; --line:#e6ebe6; --red:#d43d3d; --blue:#2a6fb5;
}
html,body{height:100%}
body{font-family:-apple-system,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:66px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.5px}
.topbar .sub{font-size:11px;opacity:.85;margin-top:2px}
.topbar .sync{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:84%;text-align:center}
#toast.show{opacity:1}
main{padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.sec{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sec::before{content:"";width:4px;height:15px;background:var(--gold);border-radius:2px}
.row{display:flex;align-items:center;gap:8px}
.vs{display:flex;align-items:center;gap:8px}
.vs .team{flex:1;background:#f2f7f2;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
.vs .team .name{font-size:15px;font-weight:700}
.vs .team .tag{font-size:10px;color:var(--sub);margin-top:2px}
.vs .mid{font-size:22px;font-weight:800;color:var(--gold);padding:0 2px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;background:#fbfcfb;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2)}
.btn{background:var(--green2);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:#eef4ee;color:var(--green);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#4a3800}
.btn:active{transform:scale(.97)}
.hint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
.match{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.match .top{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:6px}
.match .lg{color:var(--green);font-weight:600}
.match .tm{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px}
.match .tm .h{font-weight:700}
.match .tm .a{color:#333}
.match .tm .dash{color:var(--gold);font-weight:700}
.odds{display:flex;gap:6px}
.odds .oc{flex:1;text-align:center;background:#f6f8f6;border-radius:8px;padding:5px;font-size:11px}
.odds .oc b{display:block;font-size:14px;color:var(--green)}
.odds .oc.win b{color:var(--red)}
.odds .oc.lose b{color:var(--blue)}
.odds .oc.dr {border:1px solid var(--gold);background:#fffaf0}
.pick{display:inline-flex;align-items:center;gap:4px;background:#eef7ef;border:1px solid #cdebd2;color:var(--green);font-size:12px;font-weight:600;border-radius:14px;padding:4px 10px;margin-top:6px}
.pick.pred{background:#fff7dd;border-color:#f0dd9a;color:#8a6d00}
.resultbar{display:flex;gap:6px;margin-top:6px}
.resultbar .rb{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.resultbar .rb.hit{border-color:var(--green2);background:#eaf7ee;color:var(--green)}
.resultbar .rb.wrong{border-color:var(--red);background:#fdeeee;color:var(--red)}
.resultbar .rb.active{border-color:var(--green2)}
.tagp{display:inline-block;font-size:10px;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.tp-h{background:#eaf7ee;color:var(--green)}
.tp-w{background:#fdeeee;color:var(--red)}
.tp-b{background:#eef2fd;color:var(--blue)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;height:60px}
.nav .it{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--sub);cursor:pointer;background:#fff;border:none}
.nav .it.on{color:var(--green);font-weight:700}
.nav .it .ic{font-size:19px;line-height:1}
.hide{display:none!important}
.list-empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0;line-height:1.8}
.teambox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{font-size:10px;background:#eef3ef;border-radius:6px;padding:3px 7px;color:var(--sub)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat:last-child{border:none}
.stat b{color:var(--green)}
.anabar{background:#f2f7f2;border-radius:8px;overflow:hidden;height:8px;margin:4px 0}
.anabar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),#2fbf6f)}
.conf{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:6px}
.hbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:6px 0}
.hbar i{display:block}
.mg{border:2px solid var(--gold)!important;box-shadow:0 0 0 3px rgba(245,179,1,.18)}
input[readonly]{background:#eef2ee;color:#555}
.togg{font-size:11px;color:var(--green2);text-decoration:underline;cursor:pointer;margin-top:4px;display:inline-block}
.emptymatch{text-align:center;color:var(--sub);font-size:13px;padding:20px 0}
/* ===== 比赛详情增强：玩法网格 + 投注占比 ===== */
.modal-title{font-size:18px;font-weight:800;text-align:center;color:var(--green);margin:2px 0 2px}
.modal-sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:4px}
.blk{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.blk-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.blk-title .tag{font-size:11px;color:var(--sub);font-weight:500}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick3 .p{text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:7px 4px;font-size:12px}
.pick3 .p b{display:block;font-size:17px;color:var(--txt)}
.pick3 .p .lb{font-size:11px;color:var(--sub)}
.pick3 .p.h{background:#eaf7ee;border-color:var(--green2)}
.pick3 .p.d{background:#fdf6e0;border-color:#e0c34a}
.pick3 .p.a{background:#eef3fb;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cell{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.cell b{font-size:13px;color:var(--green)}
.cell.h b{color:var(--red)}.cell.d b{color:#8a6d00}.cell.a b{color:var(--blue)}
.vote{position:relative;background:#f2f5f2;border-radius:6px;height:26px;display:flex;overflow:hidden;margin:4px 0 6px}
.vote i{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.vrate{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.vrate .h{color:var(--red)}.vrate .d{color:#8a6d00}.vrate .a{color:var(--blue)}
.vmeta{font-size:11px;color:var(--sub);margin-top:6px;text-align:right}
.loading{color:var(--sub);font-size:13px;text-align:center;padding:6px 0}
.scroll-x{overflow-x:auto;white-space:nowrap;padding-bottom:4px}
.cr-row{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.cr-lab{font-size:11px;color:var(--sub);margin:2px 0 0}
/* ===== 智能预测面板 ===== */
.pred-card{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border-radius:12px;padding:14px;margin:10px 0}
.pred-card .pick{display:flex;gap:6px;margin-top:10px}
.pred-card .pick div{flex:1;text-align:center;background:rgba(255,255,255,.18);border-radius:8px;padding:8px 2px}
.pred-card .pick div.on{background:var(--gold);color:#6b4a00;font-weight:800}
.pred-card .pick b{display:block;font-size:18px}
.pred-card .pick .lb{font-size:11px;opacity:.9}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.trend-cell{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px}
.trend-cell .tm{color:var(--sub);font-size:11px}
.up{color:var(--red);font-weight:700}
.dn{color:var(--green2);font-weight:700}
.flat{color:var(--sub)}
.pbar{background:#f2f5f2;border-radius:5px;height:14px;overflow:hidden;position:relative;margin:3px 0 1px}
.pbar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:5px}
.slab{font-size:12px;margin:3px 0}
.ext-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ext-links a{text-decoration:none;font-size:12px;border:1px solid var(--green2);color:var(--green);border-radius:16px;padding:4px 10px;background:#fff}
.note{font-size:11px;color:var(--sub);line-height:1.5;margin-top:6px}
.btn-back{display:block;width:100%;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>⚽ 足球记录分析</h1>
    <div class="sub" id="subbar">点击同步获取今日竞彩</div>
  </div>
  <button class="sync" id="btnSync">⟳ 同步赛程</button>
</div>

<main>
  <!-- ======= 首页 ======= -->
  <section id="v-home">
    <div class="card">
      <div class="sec">今日 / 近期竞彩赛程</div>
      <button class="btn" id="btnFetch"><span id="fetchTxt">📡 一键获取今日比赛</span></button>
      <div class="hint">从中国体彩官网实时拉取开售比赛（含赔率/排名），点击比赛可"收藏记录"进你的分析库。</div>
      <div id="apiList" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="sec">快速录入比赛</div>
      <div class="vs">
        <div class="team"><div class="name" contenteditable="false" id="qhome">主队</div><div class="tag" id="qhomeTag">点下方快速匹配</div></div>
        <div class="mid">VS</div>
        <div class="team"><div class="name" contenteditable="false" id="qaway">客队</div><div class="tag" id="qawayTag">待定</div></div>
      </div>
      <div style="margin-top:10px" class="field">
        <label>🔍 输入主队名自动匹配客队</label>
        <input id="qInput" placeholder="例如：曼联 / 上海海港 / 皇马" />
      </div>
      <div id="qMatchList"></div>
      <button class="btn" id="btnQOpen" style="margin-top:6px">＋ 新增比赛到记录库</button>
    </div>
  </section>

  <!-- ======= 记录库 ======= -->
  <section id="v-record" class="hide">
    <div class="card">
      <div class="sec">我的记录库</div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" id="btnAddMatch" style="flex:1">＋ 手动新增</button>
        <button class="btn ghost" id="btnBackup" style="flex:1">💾 备份/导出</button>
      </div>
      <div id="recordList" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- ======= 分析 ======= -->
  <section id="v-analyze" class="hide">
    <div class="card">
      <div class="sec">近期数据与分析</div>
      <div id="teamRecent"></div>
    </div>
  </section>

  <!-- ======= 回测 ======= -->
  <section id="v-backtest" class="hide">
    <div class="card">
      <div class="sec">每日回测</div>
      <div class="hint">对已录入且填写了预测的比赛，录入真实赛果即可自动判定命中。</div>
      <div id="backtestList"></div>
    </div>
    <div class="card">
      <div class="sec">命中统计</div>
      <div id="btStat"></div>
    </div>
  </section>
</main>

<!-- 底部导航 -->
<div class="nav">
  <button class="it on" data-v="v-home"><span class="ic">🏠</span>赛程</button>
  <button class="it" data-v="v-record"><span class="ic">📝</span>记录库</button>
  <button class="it" data-v="v-analyze"><span class="ic">📊</span>分析</button>
  <button class="it" data-v="v-backtest"><span class="ic">🔁</span>回测</button>
</div>

<div id="toast"></div>

<!-- ======= 录入/编辑弹出层 ======= -->
<div id="modal" class="hide" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end">
  <div style="background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto" id="modalBody"></div>
</div>

<script>
/* ============ 数据层 localStorage ============ */
const D = {
  matches: [],     // 记录库
  teamStats: {},   // 手动近期战绩 {team:[{opp,home,gf,ga,rs,date}]} rs:H/D/A
  pred: {},        // matchId -> {choice,win,draw,lose,at}
  result: {},      // matchId -> {score,rs} 赛果
  matchInfo: {}    // matchId -> {channel,injuryH,injuryA,xgH,xgA,handicap,water,note,view}
};
const LS_KEY = 'fm_data_v2';
function load(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); Object.assign(D,o);} }catch(e){} }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(D)); }
load();

/* ============ 竞彩 API ============ */
async function apiFetch(url){
  const r = await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (Linux; Android)','Referer':'https://www.lottery.gov.cn/'}});
  return await r.json();
}
async function fetchAllMatches(){
  const data = await apiFetch('https://webapi.sporttery.cn/gateway/uniform/football/getMatchCalculatorV1.qry?channel=1&poolCode=hhad,had,crs,hafu,ttg');
  if(data.errorCode!=='0'||!data.value) throw new Error(data.errorMessage||'获取失败');
  const out=[];
  for(const m of data.value.matchInfoList||[]){
    for(const s of m.subMatchList||[]){
      const had=s.had||{},hhad=s.hhad||{};
      out.push({
        id:String(s.matchId),
        league:s.leagueAbbName||'',
        home:s.homeTeamAbbName||s.homeTeamAllName||'',
        homeFull:s.homeTeamAllName||'',
        away:s.awayTeamAbbName||s.awayTeamAllName||'',
        awayFull:s.awayTeamAllName||'',
        date:m.businessDate||'', time:s.matchTime||'',
        homeRank:s.homeRank||'', awayRank:s.awayRank||'',
        win:parseFloat(had.h)||0, draw:parseFloat(had.d)||0, lose:parseFloat(had.a)||0,
        handicap:parseFloat(hhad.goalLine)||0,
        homeTeamId:s.homeTeamId||'', awayTeamId:s.awayTeamId||'',
        had:had, hhad:hhad, crs:s.crs||{}, hafu:s.hafu||{}, ttg:s.ttg||{}
      });
    }
  }
  return out;
}

// 批量拉取投注资金占比（竞彩支持率）
async function fetchSupportRates(ids){
  const map={};
  if(!ids||!ids.length) return map;
  // 优先读静态 support.json（GitHub Actions 自动更新，同源无 CORS 限制）
  try{
    const r=await fetch('./support.json?v='+Date.now());
    if(r.ok){
      const j=await r.json();
      for(const k in (j.matches||{})) map[k]=j.matches[k];
      // 静态数据缺失的场次(如新增)，尝试直连竞彩接口兑底
      const missing=ids.filter(id=>!map[id]);
      if(missing.length){
        const CH=30;
        for(let i=0;i<missing.length;i+=CH){
          const chunk=missing.slice(i,i+CH);
          const url='https://webapi.sporttery.cn/gateway/jc/common/getSupportRateV1.qry?matchIds='+chunk.join(',')+'&poolCode=hhad,had&sportType=1';
          try{ const data=await apiFetch(url); if(data&&data.value){ for(const k in data.value) map[k.replace(/^_/,'')]=data.value[k]; } }catch(e){}
        }
      }
    }
  }catch(e){ /* 静态文件不可用时静默，交由调用方处理 */ }
  return map;
}

let lastApiMatches=[];
async function doSync(msg){
  toast(msg||'正在获取今日赛程…');
  try{
    const list=await fetchAllMatches();
    lastApiMatches=list;
    // 批量拉取投注占比（失败不阻断列表展示）
    try{ const sup=await fetchSupportRates(list.map(x=>x.id)); list.forEach(x=>x.support=sup[x.id]||null); }catch(e){}
    renderApiList(list);
    toast('✅ 获取到 '+list.length+' 场比赛');
    subbar.textContent='已同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ toast('⚠️ '+e.message); }
}

/* ============ 渲染 ============ */
const $=id=>document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderApiList(list){
  const box=$('apiList');
  if(!list.length){ box.innerHTML='<div class="emptymatch">暂无开售比赛，或今日无竞彩场次。<br>可在下方"快速录入"手工添加。</div>'; return; }
  box.innerHTML=list.map(m=>{
    const saved=D.matches.some(x=>x.id===m.id);
    return `<div class="match ${saved?'mg':''}" data-id="${esc(m.id)}">
      <div class="top"><span class="lg">${esc(m.league)}</span><span>${esc(m.date)} ${esc(m.time)}</span></div>
      <div class="tm"><span class="h">${esc(m.home)}</span><span class="dash">vs</span><span class="a">${esc(m.away)}</span>${m.handicap?'<span class="badge">让球'+m.handicap+'</span>':''}</div>
      <div class="odds">
        <div class="oc win"><b>${m.win||'-'}</b>主胜</div>
        <div class="oc dr"><b>${m.draw||'-'}</b>平</div>
        <div class="oc lose"><b>${m.lose||'-'}</b>客胜</div>
      </div>
      ${m.support&&m.support.HAD?`<div style="font-size:11px;color:var(--sub);margin-top:6px">投注占比：<span style="color:var(--red)">主${m.support.HAD.hSupportRate||'--'}</span> / <span style="color:#8a6d00">平${m.support.HAD.dSupportRate||'--'}</span> / <span style="color:var(--blue)">客${m.support.HAD.aSupportRate||'--'}</span></div>`:''}
      <div class="row" style="gap:6px;margin-top:8px">
        <button class="btn" style="flex:1;padding:9px" onclick="event.stopPropagation();showPrediction(lastApiMatches.find(x=>x.id==='${m.id}')||m)">🔮 直接分析</button>
        ${saved?'<span class="pick" style="align-self:center;flex:1;text-align:center">✓ 已收藏</span>':'<button class="btn ghost" style="flex:1;padding:9px" onclick="event.stopPropagation();saveFromApi(\''+m.id+'\')">＋ 收藏</button>'}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.match').forEach(el=>{
    el.addEventListener('click',()=>{ const id=el.dataset.id; const m=lastApiMatches.find(x=>x.id===id); if(m) showMatchDetail(m); });
  });
}

function saveFromApi(id){
  const m=lastApiMatches.find(x=>x.id===id); if(!m) return;

  D.matches.unshift({
    id:m.id, league:m.league, home:m.home, away:m.away,
    time:(m.date||'')+' '+(m.time||''), win:m.win, draw:m.draw, lose:m.lose, handicap:m.handicap,
    created:Date.now(), manual:false
  });

}

/* ============ 投注资金占比（竞彩支持率） ============ */
function renderSupportHtml(boxId,sup,m){
  const box=$(boxId); if(!box) return;
  const base='<div class="blk"><div class="blk-title">💰 投注资金占比 <span class="tag">竞彩支持率</span></div>';
  if(!sup||(!sup.HAD&&!sup.HHAD)){
    box.innerHTML=base+`<div class="loading">暂无投注占比数据
      <button class="btn ghost" style="padding:4px 8px;font-size:12px;display:inline;width:auto;margin-left:4px" onclick="refreshSupport('${m.id}')">刷新</button></div></div>`;
    return;
  }
  const ratebar=(t)=>{
    if(!t) return '';
    const hs=parseFloat(t.hSupportRate)||0, ds=parseFloat(t.dSupportRate)||0, as=parseFloat(t.aSupportRate)||0;
    const hp=t.hProbability||'', dp=t.dProbability||'', ap=t.aProbability||'';
    const tot=(hs+ds+as)||1;
    return `<div class="vote">
        <i style="width:${(hs/tot*100).toFixed(1)}%;background:var(--red)">${hs||''}</i>
        <i style="width:${(ds/tot*100).toFixed(1)}%;background:#c9a227">${ds||''}</i>
        <i style="width:${(as/tot*100).toFixed(1)}%;background:var(--blue)">${as||''}</i>
      </div>
      <div class="vrate">
        <span class="h">主胜 ${hs}${hp?'（概率'+hp+'）':''}</span>
        <span class="d">平 ${ds}${dp?'（'+dp+'）':''}</span>
        <span class="a">客胜 ${as}${ap?'（'+ap+'）':''}</span>
      </div>`;
  };
  let html=base;
  if(sup.HAD) html+=`<div class="cr-lab">胜平负（HAD）</div>`+ratebar(sup.HAD);
  if(sup.HHAD) html+=`<div class="cr-lab" style="margin-top:8px">让球胜平负（HHAD${m.handicap?(' 让'+m.handicap):''}）</div>`+ratebar(sup.HHAD);
  const vt=(sup.HAD&&sup.HAD.voteDate)||(sup.HHAD&&sup.HHAD.voteDate);
  html+=`<div class="vmeta">数据更新 ${
    vt?new Date(Number(vt)).toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'--'
  }
    <button class="btn ghost" style="padding:2px 8px;font-size:11px;display:inline;width:auto;margin-left:6px" onclick="refreshSupport('${m.id}')">刷新</button></div></div>`;
  box.innerHTML=html;
}
async function refreshSupport(id){
  const m=lastApiMatches.find(x=>x.id===id); if(!m) return;
  const box=$('supportBox'); if(box) box.innerHTML='<div class="blk"><div class="blk-title">💰 投注资金占比</div><div class="loading">加载中…</div></div>';
  try{
    const sup=await fetchSupportRates([id]);
    m.support=sup[id]||null;
    const sp=$('supportBox'); if(sp) renderSupportHtml('supportBox',m.support,m);
  }catch(e){ const sp=$('supportBox'); if(sp) renderSupportHtml('supportBox',null,m); }
}

/* ============ 智能预测 ============ */
let _oddsHistCache=null;
async function loadOddsHistCache(){
  if(_oddsHistCache) return _oddsHistCache;
  try{ const r=await fetch('./odds_history.json?v='+Date.now()); if(r.ok){ _oddsHistCache=await r.json(); } }catch(e){}
  return _oddsHistCache||{updated:'',matches:{}};
}
async function fetchOddsHistory(id){
  const cache=await loadOddsHistCache();
  const rec=cache.matches&&cache.matches[id];
  const out={had: rec?(rec.hadHist||[]):[], hhad: rec?(rec.hhadHist||[]):[]};
  if(!rec || (!out.had.length&&!out.hhad.length)){
    for(const pool of ['had','hhad']){
      if(out[pool].length) continue;
      try{
        const d=await apiFetch('https://webapi.sporttery.cn/gateway/uniform/football/getOddsHistoryV1.qry?matchId='+id+'&poolCode='+pool);
        if(d&&d.value&&d.value[pool+'List']) out[pool]=d.value[pool+'List'];
      }catch(e){}
    }
  }
  return out;
}

function renderSupportBars(sup){
  const h=parseFloat(sup.hSupportRate)||0,d=parseFloat(sup.dSupportRate)||0,a=parseFloat(sup.aSupportRate)||0;
  const tot=(h+d+a)||1;
  return `<div class="vote">
      <i style="width:${(h/tot*100).toFixed(1)}%;background:var(--red)">${h||''}</i>
      <i style="width:${(d/tot*100).toFixed(1)}%;background:#c9a227">${d||''}</i>
      <i style="width:${(a/tot*100).toFixed(1)}%;background:var(--blue)">${a||''}</i>
    </div>
    <div class="vrate"><span class="h">主胜 ${h}</span><span class="d">平 ${d}</span><span class="a">客胜 ${a}</span></div>`;
}

function renderOddsCurve(list,keys,labs){
  if(!list||!list.length) return '<div class="loading">暂无可显示数据</div>';
  return list.map((r,i)=>{
    const prev=list[i-1];
    let row='';
    keys.forEach((k,ki)=>{ if(r[k]==null||r[k]==='') return;
      const dir = prev && parseInt(prev[k])!=null ? ((parseFloat(r[k])>parseFloat(prev[k])?'<span class="up">↑</span>':parseFloat(r[k])<parseFloat(prev[k])?'<span class="dn">↓</span>':'<span class="flat">→</span>')) : '';
      row+=`<span style="margin-right:10px">${labs[ki]} ${r[k]} ${dir}</span>`;
    });
    const t=(r.updateTime||'').slice(0,5);
    return `<div class="trend-cell"><span>${t||('第'+(i+1)+'次')}</span><span>${row}</span></div>`;
  }).join('');
}

function calcPrediction(had, hadList, sup){
  const hv=parseFloat(had.h),dv=parseFloat(had.d),av=parseFloat(had.a);
  const ih=hv?1/hv:1.0, id=dv?1/dv:1.0, ia=av?1/av:1.0;
  const is=ih+id+ia||1;
  const imp={h:ih/is,d:id/is,a:ia/is};
  let supn=null;
  if(sup){
    const sh=parseFloat(sup.hSupportRate)||0,sd=parseFloat(sup.dSupportRate)||0,sa=parseFloat(sup.aSupportRate)||0;
    const ss=sh+sd+sa; if(ss>0) supn={h:sh/ss,d:sd/ss,a:sa/ss};
  }
  const trend={h:0,d:0,a:0};
  if(hadList&&hadList.length>1){
    const f=hadList[0],l=hadList[hadList.length-1];
    ['h','d','a'].forEach(k=>{ if(f[k]!=null&&l[k]!=null&&parseFloat(f[k])>0){
      const delta=parseFloat(l[k])-parseFloat(f[k]);
      trend[k]=delta>0?-0.05:(delta<0?0.05:0);
    }});
  }
  const wI=0.5, wS=0.35, wT=0.15;
  const score={h:imp.h*wI+(supn?supn.h*wS:imp.h*wS)+trend.h*wT, d:imp.d*wI+(supn?supn.d*wS:imp.d*wS)+trend.d*wT, a:imp.a*wI+(supn?supn.a*wS:imp.a*wS)+trend.a*wT};
  const tot=score.h+score.d+score.a||1;
  const pH=(score.h/tot*100).toFixed(1), pD=(score.d/tot*100).toFixed(1), pA=(score.a/tot*100).toFixed(1);
  let choice='D'; let cm=score.d;
  if(score.h>=cm){choice='H';cm=score.h;}
  if(score.a>cm){choice='A';cm=score.a;}
  const conf=Math.round(cm/tot*100);
  return {pH,pD,pA,choice,choiceName:{H:'主胜',D:'平',A:'客胜'}[choice],conf,score};
}

/* ============ 玩法解析辅助 ============ */
function oddsTime(o){ return (o&&o.updateTime)?`<div class="cr-lab">赔率更新 ${o.updateDate||''} ${o.updateTime}</div>`:''; }
const HAFUMAP={h:'主胜',d:'平',a:'客胜'};
function renderCrs(crs){
  if(!crs) return '<div class="loading">比分玩法未开售</div>';
  const rows={H:[],D:[],A:[]};
  for(const k in crs){
    const m2=k.match(/^s(\d+)s(\d+)$/); if(!m2) continue;
    const v=parseFloat(crs[k]); if(!v) continue;
    const hg=+m2[1], ag=+m2[2];
    rows[hg>ag?'H':hg===ag?'D':'A'].push({label:hg+':'+ag,v});
  }
  const pick=arr=>{
    const s=arr.slice().sort((a,b)=>a.v-b.v).slice(0,8);
    return s.map(x=>`<div class="cell ${x.label.split(':')[0]>x.label.split(':')[1]?'h':x.label.split(':')[0]===x.label.split(':')[1]?'d':'a'}"><span>${x.label}</span><b>${x.v}</b></div>`).join('');
  };
  const lab={H:'主胜',D:'平局',A:'客胜'};
  let html='';
  for(const g of ['H','D','A']){
    if(!rows[g].length) continue;
    html+=`<div class="cr-row"><div class="cr-lab">${lab[g]}</div><div class="grid3">${pick(rows[g])}</div></div>`;
  }
  return html||'<div class="loading">比分玩法未开售</div>';
}
function renderHafu(hafu){
  if(!hafu) return '<div class="loading">半全场未开售</div>';
  const cells=['hh','hd','ha','dh','dd','da','ah','ad','aa'].filter(k=>parseFloat(hafu[k])).map(k=>{
    const v=parseFloat(hafu[k]);
    const cls=k[0]==='h'?'h':k[0]==='d'?'d':'a';
    return `<div class="cell ${cls}"><span>${HAFUMAP[k[0]]}/${HAFUMAP[k[1]]}</span><b>${v}</b></div>`;
  });
  return cells.length?`<div class="grid3">${cells.join('')}</div>`:'<div class="loading">半全场未开售</div>';
}
function renderTtg(ttg){
  if(!ttg) return '<div class="loading">总进球未开售</div>';
  const cells=[0,1,2,3,4,5,6,7].filter(i=>parseFloat(ttg['s'+i])).map(i=>{
    const v=parseFloat(ttg['s'+i]);
    return `<div class="cell" style="display:inline-flex;margin-right:6px"><span>${i===7?'7+':i}球</span><b>${v}</b></div>`;
  });
  return cells.length?cells.join(''):'<div class="loading">总进球未开售</div>';
}
function setPred(id,choice,btn){
  const m=lastApiMatches.find(x=>x.id===id); if(!m) return;
  D.pred[id]={choice,win:m.win,draw:m.draw,lose:m.lose,at:Date.now()};
  save(); renderPred(id);
}
function renderPred(id){
  const p=D.pred[id]; const el=$('mypick'); if(!el) return;
  el.style.display='block';
  el.innerHTML = p ? ('我的预测：<b>'+({H:'主胜',D:'平',A:'客胜'}[p.choice])+'</b>') : '尚未预测';
}
function saveResult(id){
  const score=($('inScore').value||'').trim();
  if(!/^\d+\s*[-:]\s*\d+$/.test(score)){ toast('请填写比分，如 2-1'); return; }
  const [hg,ag]=score.split(/[-:]/).map(Number);
  const rs = hg>ag?'H':hg<ag?'A':'D';
  D.result[id]={score,rs,at:Date.now()};
  save(); renderBacktest(); renderRecordList();
  const p=D.pred[id];
  if(p){ const hit = p.choice===rs; toast(hit?'🎯 命中！':'❌ 未命中。真实：'+({H:'主胜',D:'平',A:'客胜'}[rs])); }
  else toast('✅ 赛果已保存');
  // 同步到记录库对应比赛
  const mm=D.matches.find(x=>x.id===id); if(mm){ mm.result=score; mm.rs=rs; save(); }
  closeModal();
}

/* ---------- 分析引擎 ---------- */
function teamScore(team,isHome){
  const rec=D.teamStats[team]||[];
  if(!rec.length) return null;
  const n=rec.length;
  // 攻击/防守
  let gf=0,ga=0,w=0,dr=0,l=0;
  rec.forEach(x=>{ gf+=x.gf; ga+=x.ga; if(x.rs==='H')w++; else if(x.rs==='D')dr++; else l++; });
  const homeOnly=rec.filter(x=>x.home===isHome);
  return {
    n, gf:gf/n, ga:ga/n, winP:w/n, drP:dr/n, loseP:l/n,
    ptsP:(w*3+dr)/(n*3),
    homeN:homeOnly.length, homePtsP: homeOnly.length? (homeOnly.filter(x=>x.rs==='H').length*3+homeOnly.filter(x=>x.rs==='D').length)/(homeOnly.length*3):null,
    form:rec.slice(-5).map(x=>x.rs)
  };
}
function miAdj(mi){
  if(!mi) return {adjW:0,adjA:0,factors:[],has:false};
  let adjW=0,adjA=0; const factors=[];
  const hInj=(mi.injuryH||'').length, aInj=(mi.injuryA||'').length;
  if(hInj||aInj){
    const d=hInj-aInj, adj=Math.max(-0.12,Math.min(0.12,d*0.012));
    if(adj>0.012){ adjW-=adj; factors.push({t:'主队伤停缺阵描述更多，主队实力受损',dir:'客胜'}); }
    else if(adj<-0.012){ adjA-=(-adj); factors.push({t:'客队伤停缺阵描述更多，客队实力受损',dir:'主胜'}); }
  }
  if(mi.xgH>0 && mi.xgA>0 && mi.xgH!==mi.xgA){
    const diff=mi.xgH-mi.xgA, adj=Math.max(-0.12,Math.min(0.12,diff*0.05));
    if(adj>0){ adjW+=adj; factors.push({t:'主队xG进攻强于客队',dir:'主胜'}); }
    else { adjA+=(-adj); factors.push({t:'客队xG进攻强于主队',dir:'客胜'}); }
  }
  const hc=mi.handicap||'';
  if(/主(让|-|受让)?[\d.]+/.test(hc)){ adjW+=0.04; factors.push({t:'盘口/赔率倾向主队（'+(hc||'')+'）',dir:'主胜'}); }
  else if(/客(让|[-\d])/.test(hc)){ adjA+=0.04; factors.push({t:'盘口/赔率倾向客队（'+(hc||'')+'）',dir:'客胜'}); }
  return {adjW,adjA,factors,has: !!(mi.injuryH||mi.injuryA||mi.xgH||mi.xgA||mi.handicap||mi.note||mi.view)};
}
function renderAnalyze(home,away,m){
  const hs=teamScore(home,true), as=teamScore(away,false);
  const body=$('teamRecent');
  if(!hs||!as){
    // 有赔率 → 自动用赔率(+投注占比+补充信息)分析, 不再要求手动补数据
    if(m && (parseFloat(m.win)>1||parseFloat(m.lose)>1||(m.support&&m.support.HAD))){
      let oW=parseFloat(m.win)?1/parseFloat(m.win):1/3, oD=parseFloat(m.draw)?1/parseFloat(m.draw):1/3, oA=parseFloat(m.lose)?1/parseFloat(m.lose):1/3;
      const s=oW+oD+oA; oW/=s; oD/=s; oA/=s;
      let supProbs=null;
      if(m.support&&m.support.HAD){
        const sh=parseFloat(m.support.HAD.hSupportRate)||0, sd=parseFloat(m.support.HAD.dSupportRate)||0, sa=parseFloat(m.support.HAD.aSupportRate)||0, ss=sh+sd+sa;
        if(ss>0) supProbs={h:sh/ss,d:sd/ss,a:sa/ss};
      }
      const mi=D.matchInfo[m.id]||{};
      const miA=miAdj(mi);
      const wI=supProbs?0.6:1.0, wS=supProbs?0.4:0;
      let cw=oW*wI+(supProbs?supProbs.h*wS:0)+miA.adjW, cd=oD*wI+(supProbs?supProbs.d*wS:0), ca=oA*wI+(supProbs?supProbs.a*wS:0)+miA.adjA;
      cw=Math.max(0.01,cw); cd=Math.max(0.01,cd); ca=Math.max(0.01,ca);
      const tot=cw+cd+ca; cw/=tot; cd/=tot; ca/=tot;
      const sup=m.support&&m.support.HAD?m.support.HAD:null;
      const w=(cw*100).toFixed(0), d=(cd*100).toFixed(0), l=(ca*100).toFixed(0);
      let choice= w>=d&&w>=l?'主胜': l>=d?'客胜':'平';
      const conf=Math.max(w,d,l); const confLv=conf>=55?'高':conf>=40?'中':'低';
      body.innerHTML=`<div class="card"><div class="sec">⚡ 自动分析 · ${esc(home)} vs ${esc(away)}</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:8px">已自动基于赔率${sup?'+投注资金占比':''}计算${miA.has?' · 含补充信息':''}${m.channel?(' · '+esc(m.channel)):''}</div>
        <div class="hbar"><i style="width:${w}%;background:var(--red)"></i><i style="width:${d}%;background:#d0a500"></i><i style="width:${l}%;background:var(--blue)"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px"><span style="color:var(--red)">主胜 ${w}%</span><span style="color:#8a6d00">平 ${d}%</span><span style="color:var(--blue)">客胜 ${l}%</span></div>
        <div class="pick pred" style="margin:0 auto 10px;display:flex;justify-content:center">🎯 倾向：<b>${choice}</b> <span class="badge">信心：${confLv}</span></div>
        ${miA.factors.length?`<div class="sec" style="margin-top:4px">🔍 关键因素</div>${miA.factors.map(f=>`<div class="stat"><span>• ${f.t}</span><b style="color:${f.dir==='主胜'?'var(--red)':f.dir==='客胜'?'var(--blue)':'#8a6d00'}">→ ${f.dir}</b></div>`).join('')}`:''}
        ${sup?`<div class="stat"><span>投注占比</span><b>主${sup.hSupportRate} / 平${sup.dSupportRate} / 客${sup.aSupportRate}</b></div>`:''}
        <button class="btn" style="margin-top:10px" onclick="saveThisPred('${esc(m.id)}','${choice}')">✅ 保存此预测用于回测</button>
        <div class="row" style="gap:6px;margin-top:8px">
          <button class="btn ghost" style="flex:1" onclick="editRecent('${esc(home)}','${esc(away)}')">📈 补近期数据增强</button>
          <button class="btn ghost" style="flex:1" onclick="editInfo('${m.id}')">📝 补信息</button>
        </div>
        <div class="hint">已自动分析完成。补充"近期数据/伤停/xG"可让模型更准（可选）。</div>
      </div>`;
      return;
    }
    // 无赔率也无近期数据 → 引导补基础数据
    body.innerHTML=`<div class="card"><div class="sec">${esc(home)} vs ${esc(away)}</div><div class="list-empty">该场无赔率也无近期数据。<br>请先"📝 补信息"填写赔率与两队信息，即可自动分析。</div>
      <button class="btn ghost" onclick="editInfo('${m?m.id:''}')">📝 补信息</button>
      <button class="btn ghost" onclick="editRecent('${esc(home)}','${esc(away)}')">📈 补近期数据</button></div>`;
    return;
  }
  // ===== 近期状态概率 =====
  let sW = hs.winP*0.7 + hs.homePtsP*0.3;          // 主队主场强度
  let sA = as.loseP*0.7 + (1-as.homePtsP)*0.3;      // 客队客场疲软度
  const hNet=hs.gf-hs.ga, aNet=as.gf-as.ga;
  const netAdj=((hNet-aNet)*0.06);                  // 净胜球修正
  sW=Math.max(0.06,Math.min(0.92,sW+netAdj));
  sA=Math.max(0.06,Math.min(0.92,sA-netAdj));
  sW=Math.min(sW,1-sA-0.08);
  const sD=1-sW-sA;
  // ===== 赔率隐含概率(1/赔率归一) =====
  let oW,oD,oA;
  if(m && m.win>0 && m.lose>0){
    oW=1/m.win; oD=1/(m.draw||((m.win+m.lose)/2)); oA=1/m.lose;
    const s=oW+oD+oA; oW/=s; oD/=s; oA/=s;
  } else { oW=oD=oA=1/3; }
  // ===== 补充信息修正(伤停/xG/盘口) =====
  const mi=D.matchInfo[m&&m.id]||{};
  const miA=miAdj(mi);
  // ===== 融合 = 状态45% + 赔率35% + 补充信息修正 =====
  let cw=sW*0.45+oW*0.35+miA.adjW, cd=sD*0.45+oD*0.35, ca=sA*0.45+oA*0.35+miA.adjA;
  cw=Math.max(0,cw); cd=Math.max(0,cd); ca=Math.max(0,ca);
  const tot=cw+cd+ca||1; cw/=tot; cd/=tot; ca/=tot;
  const w=(cw*100).toFixed(0), d=(cd*100).toFixed(0), l=(ca*100).toFixed(0);
  let choice= w>=d&&w>=l?'主胜': l>=d?'客胜':'平';
  let conf = Math.max(w,d,l)*1;
  if(miA.factors.length) conf=Math.min(conf+8,90);
  const confLv = conf>=55?'高':conf>=40?'中':'低';
  body.innerHTML=`
    <div class="card"><div class="sec">分析结果 · ${esc(home)} vs ${esc(away)}</div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:8px">${m&&m.league?'['+esc(m.league)+'] ':''}${m&&m.channel?'['+esc(m.channel)+'] ':''}基于近期${hs.n}/${as.n}场战绩${(m&&m.win&&' · 实时赔率')||''}${miA.has?' · 含补充信息':''}</div>
      <div class="hbar"><i style="width:${w}%;background:var(--red)"></i><i style="width:${d}%;background:#d0a500"></i><i style="width:${l}%;background:var(--blue)"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px"><span style="color:var(--red)">主胜 ${w}%</span><span style="color:#8a6d00">平 ${d}%</span><span style="color:var(--blue)">客胜 ${l}%</span></div>
      <div class="pick pred" style="margin:0 auto 10px;display:flex;justify-content:center">🎯 倾向：<b>${choice}</b> <span class="badge">信心：${confLv}</span></div>
      ${miA.factors.length?`<div class="sec" style="margin-top:4px">🔍 关键因素（依据补充信息与近期数据）</div>${miA.factors.map(f=>`<div class="stat"><span>• ${f.t}</span><b style="color:${f.dir==='主胜'?'var(--red)':f.dir==='客胜'?'var(--blue)':'#8a6d00'}">→ ${f.dir}</b></div>`).join('')}`:''}
      <div class="sec">数据对比</div>
      <div class="stat"><span>${esc(home)} 场均进/失</span><b>${hs.gf.toFixed(1)} / ${hs.ga.toFixed(1)}</b></div>
      <div class="stat"><span>${esc(away)} 场均进/失</span><b>${as.gf.toFixed(1)} / ${as.ga.toFixed(1)}</b></div>
      <div class="stat"><span>${esc(home)} 胜率</span><b>${(hs.winP*100).toFixed(0)}%</b></div>
      <div class="stat"><span>${esc(away)} 负率</span><b>${(as.loseP*100).toFixed(0)}%</b></div>
      <button class="btn" style="margin-top:10px" onclick="saveThisPred('${esc(m?m.id:'')}','${choice}')">✅ 保存此预测用于回测</button>
    </div>
    ${miA.has?`<div class="card"><div class="sec">📝 补充信息</div>
      ${mi.injuryH?`<div class="stat"><span>${esc(home)} 伤停/缺阵</span><b>${esc(mi.injuryH)}</b></div>`:''}
      ${mi.injuryA?`<div class="stat"><span>${esc(away)} 伤停/缺阵</span><b>${esc(mi.injuryA)}</b></div>`:''}
      ${mi.xgH||mi.xgA?`<div class="stat"><span>xG 进攻实力</span><b>主 ${mi.xgH||'-'} / 客 ${mi.xgA||'-'}</b></div>`:''}
      ${mi.handicap?`<div class="stat"><span>盘口 / 水位</span><b>${esc(mi.handicap)}</b></div>`:''}
      ${mi.note?`<div class="stat"><span>战意 / 背景</span><b>${esc(mi.note)}</b></div>`:''}
      ${mi.view?`<div class="stat"><span>我的看法</span><b>${esc(mi.view)}</b></div>`:''}
    </div>`:''}
    <div class="card"><div class="sec">两队近期</div>
      ${['home','away'].map(k=>{const t=k==='home'?home:away, ss=k==='home'?hs:as;
        return `<div style="margin-bottom:8px"><b>${esc(t)}</b>：<span style="font-size:12px;color:var(--sub)">${ss.form.map(x=>({H:'胜',D:'平',A:'负'}[x])).join(' ')}</span></div>`;}).join('')}
    </div>`;
}
function saveThisPred(id,choice){
  const m=D.matches.find(x=>x.id===id);
  D.pred[id]={choice,at:Date.now()};
  if(m&&m.win)D.pred[id].win=m.win; if(m&&m.lose)D.pred[id].lose=m.lose;
  save(); toast('✅ 预测已保存，可在回测页跟进');
}

/* ============ 回测 ============ */
function renderBacktest(){
  const box=$('backtestList');
  const withPred=D.matches.filter(m=>D.pred[m.id]);
  if(!withPred.length){ box.innerHTML='<div class="list-empty">还没有带预测的比赛。<br>预测后在此录入赛果做每日回测。</div>'; return; }
  box.innerHTML=withPred.map(m=>{
    const p=D.pred[m.id], r=D.result[m.id];
    const rsP={H:'主胜',D:'平',A:'客胜'}[p.choice];
    const hit = r? (p.choice===r.rs?'🎯 命中':'❌ 未中') : '<span class="tagp tp-b">待赛果</span>';
    return `<div class="match">
      <div class="top"><span class="lg">${esc(m.league)||''}</span><span>${esc(m.time||'')}</span></div>
      <div class="tm"><span class="h">${esc(m.home)}</span><span class="dash">vs</span><span class="a">${esc(m.away)}</span></div>
      <div style="font-size:12px;margin-bottom:6px">预测：<b style="color:var(--green)">${rsP}</b> ${r?'| 赛果：<b>'+esc(r.score)+'</b> '+hit:''}</div>
      ${!r?`<div class="row" style="gap:6px"><button class="btn" style="flex:1;padding:8px" onclick="markResultMan('${m.id}')">🔁 录入赛果</button></div>`:''}
    </div>`;
  }).join('');
  // 统计
  const judged=withPred.filter(m=>D.result[m.id]);
  const hitN=judged.filter(m=>D.pred[m.id].choice===D.result[m.id].rs).length;
  const st=$('btStat');
  st.innerHTML= judged.length? `
    <div class="stat"><span>进行回测</span><b>${judged.length} 场</b></div>
    <div class="stat"><span>命中</span><b style="color:var(--green)">${hitN} 场</b></div>
    <div class="stat"><span>未中</span><b style="color:var(--red)">${judged.length-hitN} 场</b></div>
    <div class="stat"><span>命中率</span><b style="color:var(--green)">${(hitN/judged.length*100).toFixed(0)}%</b></div>` :
    '<div class="list-empty">暂无已回测的比赛</div>';
}

/* ============ 导航 ============ */
function switchTo(v){
  document.querySelectorAll('main section').forEach(s=>s.classList.add('hide'));
  const sec=$('v-'+v.slice(2)); if(sec) sec.classList.remove('hide');
  document.querySelectorAll('.nav .it').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='v-analyze') renderTeams();
  if(v==='v-backtest') renderBacktest();
  if(v==='v-record') renderRecordList();
}
function showModal(){ const m=$('modal'); m.style.display='flex'; }
function closeModal(){ const m=$('modal'); m.style.display='none'; }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.querySelectorAll('.nav .it').forEach(b=>b.onclick=()=>switchTo(b.dataset.v));

$('btnSync').onclick=()=>doSync();
$('btnFetch').onclick=()=>doSync();

/* ============ 备份导出 ============ */
$('btnBackup').onclick=()=>{
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='足球分析备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('已导出备份文件');
};
window.addEventListener('beforeunload',save);
/* 初始化 */
switchTo('v-home');
renderApiList(lastApiMatches);
doSync();  // 进入自动拉取今日真实赛程 + 投注资金占比
</script>
</body>
