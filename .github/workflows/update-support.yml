name: Update Support Rate

on:
  schedule:
    # UTC 时间, 每半小时一次 (北京时间每 :15/:45)
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch support rates
        run: python fetch_support.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add support.json odds_history.json
          if git diff --cached --quiet; then
            echo "数据无变化, 跳过推送"
          else
            git commit -m "chore: update support & odds history data"
            git push
            echo "已推送, 将触发 Pages 重新部署"
          fi
